---
# Fresh macOS guests have no Command Line Tools, so /usr/bin/python3 is only
# an installer stub and fact gathering fails. The first play uses raw (no
# Python on the guest) to install CLT, then the second play gathers facts.
- name: Bootstrap Command Line Tools on macOS guest
  hosts: macos_vms
  gather_facts: false
  become: false

  tasks:
    - name: Check for Command Line Tools
      ansible.builtin.raw: test -x /Library/Developer/CommandLineTools/usr/bin/python3 && echo present || echo missing
      register: clt_check
      changed_when: false

    # The placeholder file makes softwareupdate list the CLT package headlessly.
    - name: Install Command Line Tools through softwareupdate
      become: true
      ansible.builtin.raw: |
        set -e
        touch /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
        label=$(softwareupdate --list 2>/dev/null | sed -n 's/^\* Label: \(Command Line Tools.*\)$/\1/p' | sort -V | tail -1)
        if [ -z "$label" ]; then echo "no Command Line Tools label in softwareupdate --list" >&2; exit 1; fi
        echo "installing: $label"
        softwareupdate --install "$label" --verbose
        rm -f /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
        xcode-select --switch /Library/Developer/CommandLineTools
      when: "'missing' in clt_check.stdout"
      register: clt_install
      retries: 2
      delay: 30
      until: clt_install.rc == 0

- name: Provision macOS VM for Reverse Engineering, Telemetry, and Mach-O Analysis
  hosts: macos_vms
  gather_facts: true
  become: false

  # ida_dbgsrv_src comes from setup_vm.py run-playbook as an extra var. Do not
  # define it under vars: (a self-referencing default is a recursive template).
  vars:
    tools_catalog_file: "{{ playbook_dir }}/macos_tools.json"
    tools_catalog: "{{ lookup('file', tools_catalog_file) | from_json }}"
    enabled_tools: "{{ tools_catalog.tools | selectattr('enabled', 'equalto', true) | list }}"
    enabled_ids: "{{ enabled_tools | map(attribute='id') | list }}"
    ida_remote_port: 23946
    mcp_server_port: 4517
    ida_staging_dir: "/opt/ida_dbgsrv"
    brew_prefix: "{{ '/opt/homebrew' if ansible_facts['architecture'] in ['arm64', 'aarch64'] else '/usr/local' }}"
    brew_bin: "{{ brew_prefix }}/bin/brew"
    brew_sudoers: "/etc/sudoers.d/zz-ansible-homebrew"

  # Play-level environment is templated before facts exist (it applies to
  # fact gathering too), so it cannot use brew_prefix. List both prefixes.
  environment:
    PATH: "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin"
    HOMEBREW_NO_AUTO_UPDATE: "1"
    HOMEBREW_NO_INSTALL_CLEANUP: "1"

  tasks:
    - name: Display macOS system facts
      ansible.builtin.debug:
        msg: "Connected to {{ ansible_facts['nodename'] }} (macOS {{ ansible_facts['distribution_version'] }} {{ ansible_facts['architecture'] }})"

    # 1. IDA remote debug server
    - name: Ensure IDA remote debug staging directory exists
      become: true
      ansible.builtin.file:
        path: "{{ ida_staging_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ ansible_user_id }}"

    - name: Choose the IDA macOS debug server for this architecture
      ansible.builtin.set_fact:
        ida_mac_server: "{{ 'mac_server_arm' if ansible_facts['architecture'] in ['arm64', 'aarch64'] else 'mac_server' }}"

    - name: Check the IDA macOS debug server on the controller
      ansible.builtin.stat:
        path: "{{ ida_dbgsrv_src }}/{{ ida_mac_server }}"
      register: ida_src_stat
      delegate_to: localhost
      when: ida_dbgsrv_src | default('') | length > 0

    - name: Warn when no IDA debug server will be copied
      ansible.builtin.debug:
        msg: "IDA debug server NOT copied. Run through 'setup_vm.py run-playbook' or pass -e ida_dbgsrv_src=/path/to/IDA/dbgsrv."
      when: not (ida_src_stat.stat.exists | default(false))

    - name: Copy IDA macOS remote debug server from the controller
      ansible.builtin.copy:
        src: "{{ ida_dbgsrv_src }}/{{ ida_mac_server }}"
        dest: "{{ ida_staging_dir }}/{{ ida_mac_server }}"
        mode: "0755"
      when: ida_src_stat.stat.exists | default(false)

    # mac_server needs the debugger entitlement path to be trusted; developer
    # mode lets an admin user debug without a GUI prompt per attach.
    - name: Enable developer mode for debugging
      become: true
      ansible.builtin.command: DevToolsSecurity -enable
      changed_when: false
      ignore_errors: true

    # 2. PF anchor for IDA and MCP ports
    - name: Configure PF anchor for IDA debug server and Computer Use MCP
      become: true
      ignore_errors: true
      block:
        - name: Deploy PF anchor rules
          ansible.builtin.copy:
            dest: "/etc/pf.anchors/com.re.tools"
            content: |
              pass in proto tcp from any to any port {{ ida_remote_port }}
              pass in proto tcp from any to any port {{ mcp_server_port }}
            mode: "0644"
            owner: root
            group: wheel

        - name: Reference the anchor in /etc/pf.conf
          ansible.builtin.blockinfile:
            path: /etc/pf.conf
            marker: "# {mark} com.re.tools"
            block: |
              anchor "com.re.tools"
              load anchor "com.re.tools" from "/etc/pf.anchors/com.re.tools"

        - name: Load the anchor rules
          ansible.builtin.command: pfctl -a com.re.tools -f /etc/pf.anchors/com.re.tools
          changed_when: false

    # 3. Homebrew
    # The Homebrew installer and pkg-based casks (osquery, temurin) call sudo
    # without a TTY. Grant NOPASSWD only for the duration of this play.
    - name: Allow passwordless sudo for Homebrew during provisioning
      become: true
      ansible.builtin.copy:
        dest: "{{ brew_sudoers }}"
        content: "{{ ansible_user_id }} ALL=(ALL) NOPASSWD: ALL\n"
        mode: "0440"
        owner: root
        group: wheel
        validate: /usr/sbin/visudo -cf %s

    - name: Install Homebrew packages
      block:
        # The install.sh path git-clones Homebrew/brew, which failed on the UTM
        # guest with repeated "Connection reset by peer". The signed .pkg is one
        # HTTPS download that curl can retry, so try it first.
        - name: Install Homebrew from the signed release pkg
          become: true
          ansible.builtin.shell: |
            set -e
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
              -o /tmp/Homebrew.pkg https://github.com/Homebrew/brew/releases/latest/download/Homebrew.pkg
            pkgutil --check-signature /tmp/Homebrew.pkg | grep -q "signed by a developer certificate issued by Apple"
            installer -pkg /tmp/Homebrew.pkg -target /
            rm -f /tmp/Homebrew.pkg
          args:
            creates: "{{ brew_bin }}"
          register: brew_pkg
          ignore_errors: true

        - name: Fall back to the Homebrew install script
          ansible.builtin.shell: |
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL --retry 6 --retry-all-errors https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          args:
            creates: "{{ brew_bin }}"
          when: brew_pkg is failed
          register: brew_script
          retries: 2
          delay: 30
          until: brew_script is succeeded

        - name: Put Homebrew in the login shell profile
          ansible.builtin.lineinfile:
            path: "{{ ansible_env.HOME }}/.zprofile"
            line: 'eval "$({{ brew_bin }} shellenv)"'
            create: true
            mode: "0644"

        - name: Collect third-party taps used by enabled formulae and casks
          ansible.builtin.set_fact:
            brew_taps: >-
              {{ (enabled_tools | selectattr('brew_formula', 'defined') | map(attribute='brew_formula') | list
                  + enabled_tools | selectattr('brew_cask', 'defined') | map(attribute='brew_cask') | list)
                 | reject('none') | select('search', '^[^/]+/[^/]+/') | map('regex_replace', '^([^/]+/[^/]+)/.*$', '\1')
                 | unique | list }}

        - name: Tap third-party repositories
          community.general.homebrew_tap:
            name: "{{ item }}"
            state: present
          loop: "{{ brew_taps }}"
          ignore_errors: true

        # Current Homebrew refuses to load formulae or casks from a tap until it
        # is trusted ("Refusing to load ... from untrusted tap").
        - name: Trust third-party taps
          ansible.builtin.command: "{{ brew_bin }} trust {{ item }}"
          loop: "{{ brew_taps }}"
          register: brew_trust
          changed_when: brew_trust.rc == 0
          failed_when: false

        # One formula per call: a single failing formula would otherwise
        # abort the whole batch.
        - name: Install Homebrew formulae
          community.general.homebrew:
            name: "{{ item.brew_formula }}"
            state: present
            update_homebrew: false
          loop: "{{ enabled_tools | selectattr('brew_formula', 'defined') | rejectattr('brew_formula', 'none') | rejectattr('brew_formula', 'equalto', '') | list }}"
          loop_control:
            label: "{{ item.brew_formula }}"
          ignore_errors: true

        - name: Install Homebrew casks
          community.general.homebrew_cask:
            name: "{{ item.brew_cask }}"
            state: present
            accept_external_apps: true
          loop: "{{ enabled_tools | selectattr('brew_cask', 'defined') | rejectattr('brew_cask', 'none') | rejectattr('brew_cask', 'equalto', '') | list }}"
          loop_control:
            label: "{{ item.brew_cask }}"
          ignore_errors: true

        - name: Install Computer Use MCP server with npm
          community.general.npm:
            name: "@zavora-ai/computer-use-mcp"
            global: true
            state: present
            executable: "{{ brew_prefix }}/bin/npm"
          when: "'computer-use-mcp' in enabled_ids"
          ignore_errors: true
      always:
        - name: Remove the temporary sudo rule
          become: true
          ansible.builtin.file:
            path: "{{ brew_sudoers }}"
            state: absent

    # 4. osquery
    - name: Stage minimal osquery.conf
      become: true
      ansible.builtin.copy:
        dest: "/var/osquery/osquery.conf"
        content: |
          {
            "options": {
              "config_plugin": "filesystem",
              "logger_plugin": "filesystem",
              "logger_path": "/var/log/osquery",
              "schedule_splay_percent": 10
            },
            "schedule": {
              "system_info": {
                "query": "SELECT hostname, cpu_brand, physical_memory FROM system_info;",
                "interval": 3600
              }
            }
          }
        mode: "0644"
        force: false
      when: "'osquery' in enabled_ids"
      ignore_errors: true

    # 5. Verification
    - name: Check catalog binaries
      ansible.builtin.stat:
        path: "{{ item.binary_path }}"
      loop: "{{ enabled_tools }}"
      loop_control:
        label: "{{ item.id }}"
      register: tool_stat

    - name: Summary report of provisioned tools
      ansible.builtin.debug:
        msg:
          found: "{{ tool_stat.results | selectattr('stat.exists') | map(attribute='item.id') | list }}"
          missing: "{{ tool_stat.results | rejectattr('stat.exists') | map(attribute='item.id') | list }}"
